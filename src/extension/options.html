<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Klippy options</title>
  <style>
    :root { color-scheme: light dark; --accent: #6a4cf0; }
    body { font: 15px/1.5 system-ui, sans-serif; max-width: 560px; margin: 32px auto; padding: 0 16px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    p.lead { margin: 0 0 24px; opacity: .75; }
    label { display: block; font-weight: 600; margin: 16px 0 4px; }
    input { width: 100%; box-sizing: border-box; padding: 8px 10px; font: inherit; border-radius: 8px; border: 1px solid #8884; }
    button { margin-top: 18px; padding: 8px 16px; font: 600 14px system-ui, sans-serif; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
    code { background: #8882; padding: 1px 5px; border-radius: 4px; }
    #status { margin-top: 20px; padding: 10px 12px; border-radius: 8px; background: #8881; }
  </style>
</head>
<body>
  <h1>Klippy</h1>
  <p class="lead">Connect the extension to the local <code>klippy-mcp</code> bridge so an agent can drive it.</p>
  <label for="port">Bridge port</label>
  <input id="port" type="number" min="1024" max="65535" placeholder="17345">
  <label for="token">Bridge token</label>
  <input id="token" type="password" autocomplete="off" placeholder="from ~/.config/klippy/token or klippy-mcp --print-token">
  <button id="save">Save and connect</button>
  <div id="status">Status: …</div>
  <script src="options.js"></script>
</body>
</html>
